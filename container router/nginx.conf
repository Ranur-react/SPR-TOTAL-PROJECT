events {}

http {
    upstream dind {
        server docker:3000;
        server docker:4001;
        server docker:4002;

        # Anda bisa menambahkan server lain di sini jika ada lebih banyak port
    }

    server {
        listen 3000;
        location / {
            proxy_pass http://docker:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 4001;
        location / {
            proxy_pass http://docker:4001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
    server {
        listen 4002;
        location / {
            proxy_pass http://docker:4002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Anda bisa menambahkan server tambahan untuk port lain di sini
}
