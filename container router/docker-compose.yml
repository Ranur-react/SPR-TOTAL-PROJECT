version: '3'

services:
  nginx:
    image: nginx:latest
    container_name: router
    ports:
      - "3000:3000"  # Anda dapat menambahkan lebih banyak port
      - "4001:4001"
      - "4002:4002" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf  # Konfigurasi Nginx
    networks:
      - jenkins
    restart: always

networks:
  jenkins:
    external: true  # Pastikan network jenkins sudah ada sebelumnya

